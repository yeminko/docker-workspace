services:
  simple-nodejs:
    build: ./simple-nodejs
    image: simple-node:latest
    container_name: simple-nodejs
    networks:
      - simple-network
    depends_on:
      - caller-nodejs
  caller-nodejs:
    build: ./caller-nodejs
    image: caller-node:latest
    container_name: caller-nodejs
    ports:
      - "4000:4000"
    networks:
      - simple-network

networks:
  simple-network:
